appId: com.velaros.workbench
productName: VelarOS Workbench
copyright: Copyright © VelarOS

directories:
  output: artifacts/desktop
  buildResources: resources/icons

files:
  - build/electron/**/*
  - package.json
  - LICENSE
  - '!node_modules/@velaros-ai/**/*.{ts,tsx,mts,cts,tsbuildinfo}'
  - '!node_modules/@velaros-ai/**/{test,tests,spec,fixtures}/**/*'
  - '!node_modules/@velaros-ai/**/*.{test,spec}.{js,mjs,cjs}'
  - '!node_modules/gpt-tokenizer/cjs/**/*'
  - '!node_modules/gpt-tokenizer/data/**/*'
  - '!node_modules/gpt-tokenizer/dist/**/*'
  - '!node_modules/gpt-tokenizer/src/**/*'
  - '!node_modules/gpt-tokenizer/esm/**/*.map'
  - '!node_modules/gpt-tokenizer/esm/bpeRanks/cl100k_base.js'
  - '!node_modules/gpt-tokenizer/esm/bpeRanks/p50k_base.js'
  - '!node_modules/gpt-tokenizer/esm/bpeRanks/p50k_edit.js'
  - '!node_modules/gpt-tokenizer/esm/bpeRanks/r50k_base.js'

asar: true
# 伪终端的原生二进制与 spawn-helper 可执行文件必须是磁盘上的真文件，asar 里的不能 exec。
asarUnpack:
  - node_modules/@lydell/**
  - node_modules/node-*/bin/node*
artifactName: VelarOS-Workbench-${version}-${os}-${arch}.${ext}
afterPack: ./scripts/release/verifyPackagedWorkbench.mjs

extraResources:
  - from: node_modules/devicons-react/LICENSE
    to: licenses/devicons-react.LICENSE
  # electron-builder 的复制器会跳过映射根的 node_modules；从缓存父目录映射整个运行环境。
  - from: build/cache
    to: .
    filter:
      - node-runtime/**/*
  - from: node_modules/typescript
    to: typescript
    filter:
      - package.json
      - LICENSE.txt
      - lib/lib*.d.ts
      - lib/typescript.js
      - 'lib/*/diagnosticMessages.generated.json'

mac:
  category: public.app-category.developer-tools
  forceCodeSigning: true
  hardenedRuntime: true
  notarize: true
  extendInfo:
    CFBundleDocumentTypes:
      - CFBundleTypeName: Workbench Project Folder
        CFBundleTypeRole: Editor
        LSHandlerRank: Alternate
        LSItemContentTypes:
          - public.folder
      - CFBundleTypeName: Workbench File
        CFBundleTypeRole: Editor
        LSHandlerRank: Alternate
        LSItemContentTypes:
          - public.data
          - public.content
          - public.source-code
  target:
    - dmg
    - zip

dmg:
  sign: true

win:
  icon: resources/icons/icon.ico
  target:
    - zip
    - nsis

nsis:
  oneClick: false
  allowElevation: true
  allowToChangeInstallationDirectory: true
  createDesktopShortcut: true
  createStartMenuShortcut: true
  menuCategory: VelarOS
  shortcutName: VelarOS Workbench
  uninstallDisplayName: VelarOS Workbench
  installerLanguages:
    - en_US
    - zh_CN

linux:
  category: Development
  syncDesktopName: true
  executableArgs:
    - '%F'
  target:
    - AppImage
    - deb
