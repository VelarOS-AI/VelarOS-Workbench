appId: com.velaros.workbench
productName: VelarOS Workbench
copyright: Copyright © VelarOS

directories:
  output: release

files:
  - out/**/*
  - package.json

asar: true
artifactName: VelarOS-Workbench-${version}-${os}-${arch}.${ext}
afterPack: ./scripts/release/verifyPackagedWorkbench.mjs

extraResources:
  - from: node_modules/typescript/lib
    to: typescript/lib
    filter:
      - lib*.d.ts

mac:
  category: public.app-category.developer-tools
  hardenedRuntime: true
  notarize: true
  extendInfo:
    CFBundleDocumentTypes:
      - CFBundleTypeName: Workbench Project Folder
        CFBundleTypeRole: Editor
        LSHandlerRank: Alternate
        LSItemContentTypes:
          - public.folder
      - CFBundleTypeName: Workbench File
        CFBundleTypeRole: Editor
        LSHandlerRank: Alternate
        LSItemContentTypes:
          - public.data
          - public.content
          - public.source-code
  target:
    - dmg
    - zip

win:
  target:
    - nsis

linux:
  category: Development
  executableArgs:
    - '%F'
  target:
    - AppImage
    - deb
