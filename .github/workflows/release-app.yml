name: Release Workbench

on:
  workflow_dispatch:
    inputs:
      release_tag:
        description: Exact app version tag, for example v0.3.0
        required: true
        type: string
  push:
    tags:
      - 'v*'

permissions:
  contents: write
  packages: read

concurrency:
  group: release-workbench-${{ github.event_name == 'workflow_dispatch' && inputs.release_tag || github.ref_name }}
  cancel-in-progress: false

env:
  RELEASE_TAG: ${{ github.event_name == 'workflow_dispatch' && inputs.release_tag || github.ref_name }}

jobs:
  package:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-14
            command: package:mac
            artifact: macos
          - os: windows-latest
            command: package:win
            artifact: windows
          - os: ubuntu-latest
            command: package:linux
            artifact: linux
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.13
      - run: bun install --frozen-lockfile
        env:
          NODE_AUTH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - name: Verify tag matches Workbench app version
        run: node scripts/release/appReleaseArtifacts.mjs validate-tag
      - name: Verify release signing credentials
        if: runner.os != 'Linux'
        shell: bash
        env:
          CSC_LINK: ${{ runner.os == 'macOS' && secrets.MACOS_CSC_LINK || secrets.WINDOWS_CSC_LINK }}
          CSC_KEY_PASSWORD: ${{ runner.os == 'macOS' && secrets.MACOS_CSC_KEY_PASSWORD || secrets.WINDOWS_CSC_KEY_PASSWORD }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_APP_SPECIFIC_PASSWORD: ${{ secrets.APPLE_APP_SPECIFIC_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: |
          node -e "const mac=process.platform==='darwin';const required=mac?['CSC_LINK','CSC_KEY_PASSWORD','APPLE_ID','APPLE_APP_SPECIFIC_PASSWORD','APPLE_TEAM_ID']:['CSC_LINK','CSC_KEY_PASSWORD'];const missing=required.filter((name)=>!process.env[name]);if(missing.length){console.error('Missing signing secrets: '+missing.join(', '));process.exit(1)}"
      - run: bun run check
      - run: bun run ${{ matrix.command }} -- --publish never
        env:
          NODE_AUTH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          CSC_LINK: ${{ runner.os == 'macOS' && secrets.MACOS_CSC_LINK || secrets.WINDOWS_CSC_LINK }}
          CSC_KEY_PASSWORD: ${{ runner.os == 'macOS' && secrets.MACOS_CSC_KEY_PASSWORD || secrets.WINDOWS_CSC_KEY_PASSWORD }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_APP_SPECIFIC_PASSWORD: ${{ secrets.APPLE_APP_SPECIFIC_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
      - name: Stage release files and SHA-256 checksums
        run: node scripts/release/appReleaseArtifacts.mjs stage "${{ matrix.artifact }}"
      - uses: actions/upload-artifact@v4
        with:
          name: workbench-${{ matrix.artifact }}
          path: release-stage/${{ matrix.artifact }}/*
          if-no-files-found: error

  release:
    needs: package
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: workbench-*
          path: release
      - name: Create or update GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          mapfile -d '' files < <(find release -type f -print0 | sort -z)
          test "${#files[@]}" -gt 0
          gh release view "$RELEASE_TAG" >/dev/null 2>&1 || gh release create "$RELEASE_TAG" --target "$GITHUB_SHA" --title "VelarOS Workbench $RELEASE_TAG" --generate-notes
          gh release upload "$RELEASE_TAG" "${files[@]}" --clobber
