name: Refresh private package lock (local only)

# Private package resolution is maintained locally with
# `bun scripts/refreshPrivatePackageLock.mjs`. This sentinel is intentionally
# inert and cannot allocate a runner or read package credentials.

on:
  workflow_dispatch:

permissions: {}

jobs:
  local-refresh-only:
    name: Disabled - refresh the private lock locally
    if: ${{ false }}
    runs-on: ubuntu-latest
    steps:
      - run: exit 1
