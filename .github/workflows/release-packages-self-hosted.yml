name: Release packages (self-hosted fallback)

on:
  workflow_dispatch:
    inputs:
      release_tag:
        description: Existing Workbench version tag to publish
        required: true
        type: string
      source_sha:
        description: Exact tagged source commit SHA
        required: true
        type: string

permissions:
  contents: read
  packages: write

concurrency:
  group: release-packages-${{ inputs.release_tag }}
  cancel-in-progress: false

jobs:
  publish:
    runs-on: [self-hosted, macOS, ARM64, velaros-package-publish]
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: ${{ inputs.source_sha }}

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.13

      - name: Install immutable release dependencies
        run: bun install --frozen-lockfile --ignore-scripts
        env:
          ELECTRON_SKIP_BINARY_DOWNLOAD: '1'
          NODE_AUTH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Verify exact immutable release source
        shell: bash
        env:
          RELEASE_TAG: ${{ inputs.release_tag }}
          SOURCE_SHA: ${{ inputs.source_sha }}
        run: |
          set -euo pipefail
          [[ "${RELEASE_TAG}" =~ ^v[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.-]+)?(\+[0-9A-Za-z.-]+)?$ ]]
          [[ "${SOURCE_SHA}" =~ ^[a-f0-9]{40}$ ]]
          test "$(git rev-parse HEAD)" = "${SOURCE_SHA}"
          git fetch --no-tags origin "refs/tags/${RELEASE_TAG}"
          test "$(git rev-parse 'FETCH_HEAD^{commit}')" = "${SOURCE_SHA}"
          node scripts/release/appReleaseArtifacts.mjs \
            validate-source "${RELEASE_TAG}" "${SOURCE_SHA}"

      - name: Check independently consumable package
        run: bun run check

      - name: Publish immutable package
        env:
          NODE_AUTH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RELEASE_TAG: ${{ inputs.release_tag }}
          SOURCE_SHA: ${{ inputs.source_sha }}
        run: |
          node --input-type=module --eval "
            Object.assign(process.env, {
              GITHUB_SHA: process.env.SOURCE_SHA,
              RELEASE_TAG: process.env.RELEASE_TAG,
            });
            const script = new URL(
              './scripts/release/publish-packages.mjs',
              import.meta.url,
            );
            process.argv[1] = script.pathname;
            await import(script);
          "

      - uses: actions/upload-artifact@v4
        with:
          name: workbench-package-identity-${{ inputs.source_sha }}
          path: release-stage/package/*
          if-no-files-found: error
