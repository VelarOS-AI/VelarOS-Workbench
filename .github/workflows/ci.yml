name: CI (local only)

# Workbench checks run in a maintained local working tree with `bun run check`.
# This sentinel is intentionally inert and cannot allocate a runner or read
# repository credentials.

on:
  workflow_dispatch:

permissions: {}

jobs:
  local-check-only:
    name: Disabled - use bun run check locally
    if: ${{ false }}
    runs-on: ubuntu-latest
    steps:
      - run: exit 1
