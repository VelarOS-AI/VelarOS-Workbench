name: Release Workbench

on:
  workflow_dispatch:
    inputs:
      release_tag:
        description: Exact root version tag, for example v0.3.1
        required: true
        type: string
      release_channel:
        description: Update channel
        type: choice
        options:
          - stable
          - beta
          - canary
        default: stable
  push:
    tags:
      - 'v*'

permissions:
  contents: write
  packages: read

concurrency:
  group: release-workbench-${{ github.event_name == 'workflow_dispatch' && inputs.release_tag || github.ref_name }}
  cancel-in-progress: false

env:
  RELEASE_TAG: ${{ github.event_name == 'workflow_dispatch' && inputs.release_tag || github.ref_name }}
  VELAROS_UPDATE_CHANNEL: ${{ github.event_name == 'workflow_dispatch' && inputs.release_channel || 'stable' }}

jobs:
  prepare:
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: ${{ env.RELEASE_TAG }}
      - name: Resolve exact checked-out release source
        run: echo "RELEASE_SOURCE_SHA=$(git rev-parse HEAD)" >> "$GITHUB_ENV"
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.13
      - run: bun install --frozen-lockfile --ignore-scripts
        env:
          ELECTRON_SKIP_BINARY_DOWNLOAD: '1'
          NODE_AUTH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - name: Verify exact immutable release source
        run: node scripts/release/releaseArtifacts.mjs validate-source
      - name: Run the complete release check
        run: bun run check
      - name: Create or validate draft release checkpoint
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          if gh release view "$RELEASE_TAG" >/dev/null 2>&1; then
            target="$(gh release view "$RELEASE_TAG" --json targetCommitish --jq .targetCommitish)"
            resolved="$(git rev-parse "${target}^{commit}")"
            test "$resolved" = "$RELEASE_SOURCE_SHA"
          else
            gh release create "$RELEASE_TAG" \
              --draft \
              --verify-tag \
              --target "$RELEASE_SOURCE_SHA" \
              --title "VelarOS Workbench $RELEASE_TAG" \
              --generate-notes
          fi

  package:
    needs: prepare
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-14
            command: package:mac
            artifact: macos
          - os: windows-latest
            command: package:win
            artifact: windows
          - os: ubuntu-latest
            command: package:linux
            artifact: linux
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: ${{ env.RELEASE_TAG }}
      - name: Resolve exact checked-out release source
        run: echo "RELEASE_SOURCE_SHA=$(git rev-parse HEAD)" >> "$GITHUB_ENV"
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.13
      - run: bun install --frozen-lockfile
        env:
          NODE_AUTH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - name: Verify exact immutable release source
        run: node scripts/release/releaseArtifacts.mjs validate-source
      - name: Download prior release checkpoint
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          mkdir -p artifacts/release-existing
          gh release download "$RELEASE_TAG" --dir artifacts/release-existing || true
      - name: Reuse prior immutable platform checkpoint
        id: reuse
        run: node scripts/release/releaseArtifacts.mjs reuse "${{ matrix.artifact }}"
      - name: Verify release signing credentials
        if: steps.reuse.outputs.reuse != 'true' && runner.os != 'Linux'
        shell: bash
        env:
          CSC_LINK: ${{ runner.os == 'macOS' && secrets.MACOS_CSC_LINK || secrets.WINDOWS_CSC_LINK }}
          CSC_KEY_PASSWORD: ${{ runner.os == 'macOS' && secrets.MACOS_CSC_KEY_PASSWORD || secrets.WINDOWS_CSC_KEY_PASSWORD }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_APP_SPECIFIC_PASSWORD: ${{ secrets.APPLE_APP_SPECIFIC_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: |
          node -e "const mac=process.platform==='darwin';const required=mac?['CSC_LINK','CSC_KEY_PASSWORD','APPLE_ID','APPLE_APP_SPECIFIC_PASSWORD','APPLE_TEAM_ID']:['CSC_LINK','CSC_KEY_PASSWORD'];const missing=required.filter((name)=>!process.env[name]);if(missing.length){console.error('Missing signing secrets: '+missing.join(', '));process.exit(1)}"
      - name: Build, sign, and package once
        if: steps.reuse.outputs.reuse != 'true'
        run: bun run ${{ matrix.command }} -- --publish never
        env:
          NODE_AUTH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          CSC_LINK: ${{ runner.os == 'macOS' && secrets.MACOS_CSC_LINK || secrets.WINDOWS_CSC_LINK }}
          CSC_KEY_PASSWORD: ${{ runner.os == 'macOS' && secrets.MACOS_CSC_KEY_PASSWORD || secrets.WINDOWS_CSC_KEY_PASSWORD }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_APP_SPECIFIC_PASSWORD: ${{ secrets.APPLE_APP_SPECIFIC_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
      - name: Stage immutable release identity
        if: steps.reuse.outputs.reuse != 'true'
        run: node scripts/release/releaseArtifacts.mjs stage "${{ matrix.artifact }}"
      - name: Checkpoint newly produced platform artifacts
        if: steps.reuse.outputs.reuse != 'true'
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          manifest="artifacts/release-stage/${{ matrix.artifact }}/workbench-${{ matrix.artifact }}-release.json"
          for file in "artifacts/release-stage/${{ matrix.artifact }}"/*
          do
            if [[ "$file" != "$manifest" ]]; then
              gh release upload "$RELEASE_TAG" "$file"
            fi
          done
          gh release upload "$RELEASE_TAG" "$manifest"
      - name: Complete an adopted pre-manifest checkpoint
        if: steps.reuse.outputs.adopted_checkpoint == 'true'
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          assets="$(gh release view "$RELEASE_TAG" --json assets --jq '.assets[].name')"
          for file in \
            "artifacts/release-stage/${{ matrix.artifact }}/SHA256SUMS-${{ matrix.artifact }}.txt" \
            "artifacts/release-stage/${{ matrix.artifact }}/workbench-${{ matrix.artifact }}-release.json"
          do
            if ! grep -Fxq "$(basename "$file")" <<<"$assets"; then
              gh release upload "$RELEASE_TAG" "$file"
            fi
          done
      - uses: actions/upload-artifact@v4
        with:
          name: workbench-${{ matrix.artifact }}
          path: artifacts/release-stage/${{ matrix.artifact }}/*
          if-no-files-found: error

  release:
    needs: package
    runs-on: ubuntu-latest
    environment: release-candidates
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: ${{ env.RELEASE_TAG }}
      - name: Resolve exact checked-out release source
        run: echo "RELEASE_SOURCE_SHA=$(git rev-parse HEAD)" >> "$GITHUB_ENV"
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.13
      - run: bun install --frozen-lockfile --ignore-scripts
        env:
          ELECTRON_SKIP_BINARY_DOWNLOAD: '1'
          NODE_AUTH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - name: Verify exact immutable release source
        run: node scripts/release/releaseArtifacts.mjs validate-source
      - uses: actions/download-artifact@v4
        with:
          pattern: workbench-*
          path: artifacts/release-stage/final
          merge-multiple: true
      - name: Verify complete immutable release identities
        run: |
          node scripts/release/releaseArtifacts.mjs verify macos artifacts/release-stage/final
          node scripts/release/releaseArtifacts.mjs verify windows artifacts/release-stage/final
          node scripts/release/releaseArtifacts.mjs verify linux artifacts/release-stage/final
      - name: Publish signed Workbench update candidate
        env:
          VELAROS_RELEASE_REPOSITORY: ${{ vars.VELAROS_RELEASE_REPOSITORY }}
          VELAROS_RELEASE_REPO_TOKEN: ${{ secrets.VELAROS_RELEASE_REPO_TOKEN }}
          VELAROS_RELEASE_CATALOG_URL: ${{ vars.VELAROS_RELEASE_CATALOG_URL }}
          VELAROS_RELEASE_INGEST_TOKEN: ${{ secrets.VELAROS_RELEASE_INGEST_TOKEN }}
          VELAROS_RELEASE_ATTESTATION_PRIVATE_KEY: ${{ secrets.VELAROS_RELEASE_ATTESTATION_PRIVATE_KEY }}
          VELAROS_RELEASE_ATTESTATION_KEY_ID: ${{ vars.VELAROS_RELEASE_ATTESTATION_KEY_ID }}
        run: node scripts/release/publishUpdateCatalog.mjs artifacts/release-stage/final
      - name: Publish the completed draft without replacing assets
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh release edit "$RELEASE_TAG" --draft=false
